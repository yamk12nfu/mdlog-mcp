schema_version: 1

project:
  name: "mdlog-mcp"
  type: "node"
  risk_level: "medium"
  owner: "yamk12nfu"

runtime:
  devcontainer: null

commands:
  setup: "npm ci"
  lint: "" # lint 未整備。導入したら required にも戻す
  typecheck: "npx tsc --noEmit"
  test: "npm test"
  build: "npm run build"

quality_gates:
  required:
    - typecheck
    - test
    - build

ai:
  max_loops: 4
  max_changed_files: 10
  allowed_paths:
    - "src/**"
    - "tests/**"
    - "docs/**"
    - "README.md" # プロジェクト概要（root 直下は glob でなく個別ファイルで列挙する）
    - ".ai/local/knowledge/**"
    - ".ai/local/proposals/**"
  forbidden_paths:
    - ".env"
    - "secrets/**"
    - "infra/prod/**"
    - ".github/workflows/**"

review:
  create_pr: true
  require_human_review: true
  auto_merge: false

evals: {}
